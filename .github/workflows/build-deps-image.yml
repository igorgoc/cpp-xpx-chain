name: Build and push deps image

on:
  push:
    branches:
      - main
      - add-github-workflow
    paths:
      - 'scripts/catapult-server-docker/Dockerfile.deps'
  workflow_dispatch:

jobs:
  build-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deps image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/catapult-server-docker/Dockerfile.deps
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/proximax-storage/proximax-sirius-deps:bookworm
            ghcr.io/proximax-storage/proximax-sirius-deps:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
