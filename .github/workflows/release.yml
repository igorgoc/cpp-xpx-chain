name: release
on:
  push:
    tags:
      - v*-bookworm

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'    # fetch submodules
          fetch-depth: 0             # fetch full history (recommended for tags/submodule refs)
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Use the deps-based Dockerfile for faster builds (prebuilt deps image)
          file: ./scripts/catapult-server-docker/DockerfileDebian-linux-deps
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proximax-sirius-chain:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/proximax-sirius-chain:${{ github.ref_name }}

