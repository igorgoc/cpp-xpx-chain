name: release
on:
  push:
    tags:
      - v*-bookworm

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'    # fetch submodules
          fetch-depth: 0             # fetch full history (recommended for tags/submodule refs)
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Use the deps-based Dockerfile for faster builds (prebuilt deps image)
          file: ./scripts/catapult-server-docker/DockerfileDebian-linux-deps
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proximax-sirius-chain:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/proximax-sirius-chain:latest

